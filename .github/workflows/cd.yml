name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Self-hosted runner installed on the Raspberry Pi
    runs-on: [self-hosted, raspberry]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./scripts/deploy.sh

  # Runs after every successful deploy: updates the release PR, or tags and
  # publishes the release once that PR has been merged.
  release-please:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT lets the release PR trigger the CI workflow (GITHUB_TOKEN events don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
