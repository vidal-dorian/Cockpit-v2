name: CD

# Triggered manually (Actions tab -> CD -> Run workflow), independently of the CI.
on:
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner installed on the Raspberry Pi
    runs-on: [self-hosted, raspberry]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

  # Runs after every successful deploy: updates the release PR, or tags and
  # publishes the release once that PR has been merged.
  release-please:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT lets the release PR trigger the CI workflow (GITHUB_TOKEN events don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
