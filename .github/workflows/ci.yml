name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release-please config
        run: |
          jq empty release-please-config.json .release-please-manifest.json
          test "$(jq -r '."."' .release-please-manifest.json)" = "$(tr -d '[:space:]' < version.txt)"

      # TODO: add the project's lint / test / build steps once the stack is chosen.
